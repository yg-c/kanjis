{

  struct:["N {p:を}／{p:が}　{adj:nombre + compteur}　V"],

    {jp:"りんご{p:を}{adj:4つ}買[か]いました。",fr:"J'ai acheté quatre pommes."},

  ],
  drill:{title:"【練習[れんしゅう]】",
  items:[
    {prompt:"卵[たまご]・6つ・買[か]います",a:"卵[たまご]{p:を}{adj:6つ}買[か]いました。",fr:"J'ai acheté six œufs."},

    {prompt:"自転車[じてんしゃ]・2台[だい]・あります",a:"うちに自転車[じてんしゃ]{p:が}{adj:2台[だい]}あります。",fr:"À la maison, il y a deux vélos."}
  ]}
},
{
  title:"Les compteurs",
  struct:["〜つ（objets）: ひとつ、ふたつ、みっつ… とお ／ {q:いくつ}","〜人[にん]（personnes）: ひとり、ふたり、三人[さんにん]、四人[よにん]… ／ {q:何人[なんにん]}","〜枚[まい]（objets plats）・〜台[だい]（machines, véhicules）・〜回[かい]（fois）"],

  ]
},

    {prompt:"1年[ねん]・1回[かい]・国[くに]へ帰[かえ]ります",a:"1年[ねん]{p:に}{adj:1回[かい]}国[くに]へ帰[かえ]ります。",fr:"Je rentre dans mon pays une fois par an."}

    {jp:"毎晩[まいばん]{adj:7時間[じかん]ぐらい}寝[ね]ます。",fr:"Je dors environ sept heures chaque nuit."}
  ]
},
{

  ],
  drill:{title:"【練習[れんしゅう]】",

    {prompt:"うち・会社[かいしゃ]・電車[でんしゃ]・40分[ぷん]",a:"うちから会社[かいしゃ]まで電車[でんしゃ]{p:で}{adj:40分[ぷん]}かかります。",fr:"De chez moi au bureau, il faut 40 minutes en train."},
    {prompt:"スイス・日本[にほん]・飛行機[ひこうき]・14時間[じかん]ぐらい",a:"スイスから日本[にほん]まで飛行機[ひこうき]{p:で}{adj:14時間[じかん]ぐらい}かかります。",fr:"De la Suisse au Japon, il faut environ 14 heures en avion."},

  ]}
},
{
  title:"〜だけ ／ 全部[ぜんぶ]で",
  struct:["quantité ／ N ＋ {adj:だけ}","N を quantité ください。… {adj:全部[ぜんぶ]で}〜です。"],
  expl:"<b>だけ</b> = « seulement ». <b>全部[ぜんぶ]で</b> = « en tout, au total », par exemple pour un prix.",
