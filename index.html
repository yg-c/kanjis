<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japonais">
<meta name="theme-color" content="#9b2d23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="pwa.js" defer></script>
<title>Révision japonais</title>
<style>
  :root{
    --paper:#f3efe6;
    --ink:#1c1a17;
    --sumi:#2b2722;
    --vermilion:#c0392b;
    --seal:#9b2d23;
    --gold:#b08743;
    --muted:#7c7468;
    --line:#d9d2c4;
    --card:#fbf9f3;
    --shadow:rgba(40,34,26,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 12%, #f7f3ea 0%, var(--paper) 55%) fixed;
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    text-align:center;
    padding:34px 16px 18px;
  }
  header .seal{
    display:inline-block;
    background:var(--seal);
    color:#f3efe6;
    font-size:13px;
    letter-spacing:.35em;
    padding:6px 4px 6px 12px;
    border-radius:3px;
    box-shadow:0 2px 6px var(--shadow);
  }
  h1{
    font-size:30px;
    margin:14px 0 4px;
    letter-spacing:.12em;
    font-weight:600;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    letter-spacing:.18em;
    font-family:-apple-system,"Helvetica Neue",sans-serif;
    text-transform:uppercase;
  }

  .menu{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    max-width:720px;
    margin:0 auto;
    padding:12px 16px 60px;
  }
  @media (min-width:600px){
    .menu{grid-template-columns:1fr 1fr;}
  }
  .entry{
    display:flex;
    align-items:center;
    gap:18px;
    padding:20px 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 4px 14px var(--shadow);
    color:inherit;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .2s;
  }
  a.entry:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow);}
  a.entry:active{transform:scale(.98);}
  .entry .glyph{
    flex:none;
    width:100px;height:64px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    line-height:1;
    padding-top:8px;   /* place pour les furigana */
    color:var(--vermilion);
    border:2px solid var(--vermilion);
    border-radius:10px;
  }
  .entry .glyph rt{font-size:.42em;color:var(--muted);letter-spacing:.05em;}
  .entry .title{
    font-size:21px;
    font-weight:600;
    letter-spacing:.08em;
  }
  .entry .desc{
    margin-top:4px;
    font-family:-apple-system,"Helvetica Neue",sans-serif;
    font-size:13px;
    color:var(--muted);
  }
  .entry.soon{
    box-shadow:none;
    background:transparent;
    cursor:default;
  }
  .entry.soon .glyph{color:var(--line);border-color:var(--line);}
  .entry.soon .title{color:var(--muted);}
  .entry.soon .desc{color:#a59d90;}
  .badge{
    display:inline-block;
    margin-left:8px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--gold);
    color:#fff;
    font-family:-apple-system,sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    vertical-align:middle;
  }
</style>
</head>
<body>

<header>
  <span class="seal">日本語 ・ 復習</span>
  <h1>Révision japonais</h1>
</header>

<nav class="menu">
  <a class="entry" href="fiches_kanji.html">
    <span class="glyph"><ruby>漢字<rt>かんじ</rt></ruby></span>
    <div>
      <div class="title">Kanji</div>
      <div class="desc">Fiches de révision et quiz</div>
    </div>
  </a>
  <a class="entry" href="verbes.html">
    <span class="glyph"><ruby>動詞<rt>どうし</rt></ruby></span>
    <div>
      <div class="title">Verbes</div>
      <div class="desc">Feuilles rose, verte et bleue · formes ます, て, た, ない</div>
    </div>
  </a>
  <a class="entry" href="adjectifs.html">
    <span class="glyph"><ruby>形容詞<rt>けいようし</rt></ruby></span>
    <div>
      <div class="title">Adjectifs</div>
      <div class="desc">Adjectifs en い et en な · 4 formes polies</div>
    </div>
  </a>
  <a class="entry" href="vocabulaire_16.html">
    <span class="glyph"><ruby>語彙<rt>ごい</rt></ruby></span>
    <div>
      <div class="title">Vocabulaire</div>
      <div class="desc">Mots par chapitre</div>
    </div>
  </a>
  <a class="entry" href="grammaire_16.html">
    <span class="glyph"><ruby>文法<rt>ぶんぽう</rt></ruby></span>
    <div>
      <div class="title">Grammaire</div>
      <div class="desc">Chapitres 10 à 16 · points de grammaire</div>
    </div>
  </a>
</nav>

</body>
</html>
